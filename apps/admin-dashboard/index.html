      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var isAppleStandalone = window.navigator.standalone === true;
          if (isAppleStandalone) {
            document.documentElement.classList.add("is-apple-standalone");
            var viewport = document.querySelector('meta[name="viewport"]');
            viewport.content = viewport.content.replace("viewport-fit=cover", "viewport-fit=auto");
          }
          var isStandalone =
            isAppleStandalone ||
            (window.matchMedia &&
              window.matchMedia("(display-mode: standalone)").matches);
          if (isStandalone) {
            document.documentElement.classList.add("is-standalone");
          }
        } catch (e) {}
      })();
    </script>
  </head>
