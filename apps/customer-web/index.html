    <meta name="theme-color" content="#F0F8E8" />
    <script>
      try {
        var storePref = localStorage.getItem('mumbai_storefront_theme');
        var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var storeTheme = storePref === 'dark' ? 'dark' : (storePref === 'light' ? 'light' : (systemDark ? 'dark' : 'light'));
        document.documentElement.dataset.storeTheme = storeTheme;
        document.documentElement.dataset.storeThemePreference = storePref || 'system';
        document.documentElement.style.colorScheme = storeTheme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', storeTheme === 'dark' ? '#1F272E' : '#F0F8E8');
      } catch (_) {}
    </script>

    <script>
      (function () {
        try {
          var path = window.location.pathname || "/";
          var host = window.location.hostname || "";
          if ((path !== "/" && path !== "") || host === "localhost" || host === "127.0.0.1") return;
          var controller = typeof AbortController === "function" ? new AbortController() : null;
          var timer = controller ? setTimeout(function () { controller.abort(); }, 3500) : null;
          var clearDeadline = function () { if (timer) { clearTimeout(timer); timer = null; } };
          var configuredWpHost = "__MUMBAI_WP_HOST__";
          var normalizeHref = function (raw) {
            if (!raw || typeof raw !== "string") return "";
            var s = raw.trim();
            if (!s) return "";
            if (s.indexOf("data:") === 0 || s.indexOf("blob:") === 0 || s.indexOf("/product-placeholder.svg") === 0) return s;
            if (s.indexOf("wp-content/uploads/") === 0) {
              return "/api/media/uploads/" + s.slice("wp-content/uploads/".length);
            }
            var wpMarker = "/wp-content/uploads/";
            var wpIdx = s.indexOf(wpMarker);
            if (wpIdx !== -1) {
              var isRelWp = s.indexOf(wpMarker) === 0 || s.indexOf("wp-content/uploads/") === 0;
              var isApprovedHost = false;
              if (!isRelWp) {
                try {
                  var uHost = new URL(s).hostname.toLowerCase();
                  isApprovedHost =
                    uHost === "mumbai-collection.local" ||
                    uHost === "mumbaicollection.local" ||
                    uHost === "localhost" ||
                    uHost === "127.0.0.1" || uHost === configuredWpHost;
                } catch (_) {}
              }
              if (isRelWp || isApprovedHost) {
                var rel = s.slice(wpIdx + wpMarker.length);
                if (rel) return "/api/media/uploads/" + rel;
              }
            }
            var localMatch = s.match(/^https?:\/\/(localhost|127\.0\.0\.1):5000(\/api\/.*)$/i);
            if (localMatch) return localMatch[2];
            if (window.location.protocol === "https:" && s.indexOf("http://") === 0) {
              return "https://" + s.slice(7);
            }
            return s;
          };
          window.__MUMBAI_EARLY_BANNERS__ = fetch(
            "/api/banners",
            controller ? { credentials: "same-origin", signal: controller.signal } : { credentials: "same-origin" }
          )
            .then(function (res) { return res.ok ? res.json() : null; })
            .then(function (data) {
              if (!data || data.success !== true || !Array.isArray(data.banners)) return null;
              var first = null;
              for (var i = 0; i < data.banners.length; i++) {
                var b = data.banners[i];
                if (b && b.is_active !== false && (b.desktop_image || b.mobile_image || (b.media_type === "video" && b.video_url))) {
                  first = b;
                  break;
                }
              }
              if (first && (first.desktop_image || first.mobile_image)) {
                var isSmall = window.matchMedia && window.matchMedia("(max-width: 639px)").matches;
                var raw = isSmall ? (first.mobile_image || first.desktop_image) : (first.desktop_image || first.mobile_image);
                var href = normalizeHref(raw);
                if (href) {
                  var link = document.createElement("link");
                  link.rel = "preload";
                  link.as = "image";
                  link.href = href;
                  link.setAttribute("fetchpriority", "high");
                  document.head.appendChild(link);
                }
              }
              return data;
            })
            .catch(function () { return null; })
            .finally(clearDeadline);
        } catch (_) {}
      })();
    </script>

    <script>
      (function () {
        try {
          var isAppleStandalone = window.navigator.standalone === true;
          if (isAppleStandalone) {
            document.documentElement.classList.add("is-apple-standalone");
            var viewport = document.querySelector('meta[name="viewport"]');
            viewport.content = viewport.content.replace("viewport-fit=cover", "viewport-fit=auto");
          }
          var isStandalone =
            isAppleStandalone ||
            (window.matchMedia &&
              window.matchMedia("(display-mode: standalone)").matches);
          if (isStandalone) {
            document.documentElement.classList.add("is-standalone");

            // Auto-refresh standalone PWA on safe browse routes whenever a newer deployment exists on server
            var pendingPwaUpdate = false;
            var SENSITIVE_PWA_ROUTES = [
              "/checkout",
              "/cart",
              "/reset-password",
              "/profile",
              "/addresses",
              "/orders",
              "/login",
              "/register",
              "/forgot-password"
            ];

            var isSafeForPwaReload = function () {
              var path = (window.location.pathname || "/").toLowerCase();
              for (var i = 0; i < SENSITIVE_PWA_ROUTES.length; i++) {
                if (path === SENSITIVE_PWA_ROUTES[i] || path.indexOf(SENSITIVE_PWA_ROUTES[i] + "/") === 0) {
                  return false;
                }
              }
              var active = document.activeElement;
              if (active) {
                var tag = active.tagName;
                if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || active.isContentEditable) {
                  return false;
                }
              }
              if (document.querySelector('[role="dialog"], [aria-modal="true"]')) {
                return false;
              }
              return true;
            };

            var applyPendingPwaReload = function () {
              if (pendingPwaUpdate && isSafeForPwaReload()) {
                window.location.reload();
              }
            };

            var checkPwaFreshness = function () {
              if (pendingPwaUpdate) {
                applyPendingPwaReload();
                return;
              }
              fetch('/index.html?pwa_check=' + Date.now(), { cache: 'no-store' })
                .then(function (res) { return res.ok ? res.text() : ''; })
                .then(function (html) {
                  if (!html) return;
                  var currentScript = document.querySelector('script[src*="/assets/index-"]');
                  if (currentScript && currentScript.src) {
                    var filename = currentScript.src.split('/').pop();
                    if (filename && html.indexOf(filename) === -1 && html.indexOf('/assets/index-') !== -1) {
                      pendingPwaUpdate = true;
                      applyPendingPwaReload();
                    }
                  }
                })
                .catch(function () {});
            };

            var origPushState = window.history.pushState;
            window.history.pushState = function () {
              var result = origPushState.apply(this, arguments);
              setTimeout(applyPendingPwaReload, 0);
              return result;
            };
            window.addEventListener('popstate', function () {
              setTimeout(applyPendingPwaReload, 0);
            });

            setTimeout(checkPwaFreshness, 1000);
            document.addEventListener('visibilitychange', function () {
              if (document.visibilityState === 'visible') {
                checkPwaFreshness();
              }
            });
          }
        } catch (e) {}
      })();
    </script>
