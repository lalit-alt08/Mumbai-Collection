<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F0F8E8" />
    <script>
      try {
        var storePref = localStorage.getItem('mumbai_storefront_theme');
        var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var storeTheme = storePref === 'dark' ? 'dark' : (storePref === 'light' ? 'light' : (systemDark ? 'dark' : 'light'));
        document.documentElement.dataset.storeTheme = storeTheme;
        document.documentElement.dataset.storeThemePreference = storePref || 'system';
        document.documentElement.style.colorScheme = storeTheme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', storeTheme === 'dark' ? '#1F272E' : '#F0F8E8');
      } catch (_) {}
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mumbai Collection" />
    <title>Mumbai Collection Vasai | Toys, Games & Stationery Store</title>
    <meta
      name="description"
      content="Shop toys, games, stationery, school supplies, and everyday essentials at Mumbai Collection in Vasai. Fast same-day delivery across Vasai-Virar."
    />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mumbaicollections.in/" />
    <meta property="og:site_name" content="Mumbai Collection" />
    <meta property="og:title" content="Mumbai Collection Vasai | Toys, Games & Stationery Store" />
    <meta
      property="og:description"
      content="Shop toys, games, stationery, school supplies, and everyday essentials at Mumbai Collection in Vasai. Fast same-day delivery across Vasai-Virar."
    />
    <meta property="og:image" content="https://mumbaicollections.in/og-image.jpg" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="800" />
    <meta property="og:image:type" content="image/jpeg" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://mumbaicollections.in/" />
    <meta name="twitter:title" content="Mumbai Collection Vasai | Toys, Games & Stationery Store" />
    <meta
      name="twitter:description"
      content="Shop toys, games, stationery, school supplies, and everyday essentials at Mumbai Collection in Vasai. Fast same-day delivery across Vasai-Virar."
    />
    <meta name="twitter:image" content="https://mumbaicollections.in/og-image.jpg" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var isAppleStandalone = window.navigator.standalone === true;
          if (isAppleStandalone) {
            document.documentElement.classList.add("is-apple-standalone");
            var viewport = document.querySelector('meta[name="viewport"]');
            viewport.content = viewport.content.replace("viewport-fit=cover", "viewport-fit=auto");
          }
          var isStandalone =
            isAppleStandalone ||
            (window.matchMedia &&
              window.matchMedia("(display-mode: standalone)").matches);
          if (isStandalone) {
            document.documentElement.classList.add("is-standalone");

            // Auto-refresh standalone PWA on safe browse routes whenever a newer deployment exists on server
            var pendingPwaUpdate = false;
            var SENSITIVE_PWA_ROUTES = [
              "/checkout",
              "/cart",
              "/reset-password",
              "/profile",
              "/addresses",
              "/orders",
              "/login",
              "/register",
              "/forgot-password"
            ];

            var isSafeForPwaReload = function () {
              var path = (window.location.pathname || "/").toLowerCase();
              for (var i = 0; i < SENSITIVE_PWA_ROUTES.length; i++) {
                if (path === SENSITIVE_PWA_ROUTES[i] || path.indexOf(SENSITIVE_PWA_ROUTES[i] + "/") === 0) {
                  return false;
                }
              }
              var active = document.activeElement;
              if (active) {
                var tag = active.tagName;
                if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || active.isContentEditable) {
                  return false;
                }
              }
              if (document.querySelector('[role="dialog"], [aria-modal="true"]')) {
                return false;
              }
              return true;
            };

            var applyPendingPwaReload = function () {
              if (pendingPwaUpdate && isSafeForPwaReload()) {
                window.location.reload();
              }
            };

            var checkPwaFreshness = function () {
              if (pendingPwaUpdate) {
                applyPendingPwaReload();
                return;
              }
              fetch('/index.html?pwa_check=' + Date.now(), { cache: 'no-store' })
                .then(function (res) { return res.ok ? res.text() : ''; })
                .then(function (html) {
                  if (!html) return;
                  var currentScript = document.querySelector('script[src*="/assets/index-"]');
                  if (currentScript && currentScript.src) {
                    var filename = currentScript.src.split('/').pop();
                    if (filename && html.indexOf(filename) === -1 && html.indexOf('/assets/index-') !== -1) {
                      pendingPwaUpdate = true;
                      applyPendingPwaReload();
                    }
                  }
                })
                .catch(function () {});
            };

            var origPushState = window.history.pushState;
            window.history.pushState = function () {
              var result = origPushState.apply(this, arguments);
              setTimeout(applyPendingPwaReload, 0);
              return result;
            };
            window.addEventListener('popstate', function () {
              setTimeout(applyPendingPwaReload, 0);
            });

            setTimeout(checkPwaFreshness, 1000);
            document.addEventListener('visibilitychange', function () {
              if (document.visibilityState === 'visible') {
                checkPwaFreshness();
              }
            });
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
