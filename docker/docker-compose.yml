services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mumbai_wp}
      MYSQL_USER: ${MYSQL_USER:-mumbai}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mumbai_dev_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mumbai_root_dev_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  wordpress:
    image: wordpress:6.7-php8.2-apache
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8085}:80"
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-mumbai_wp}
      WORDPRESS_DB_USER: ${MYSQL_USER:-mumbai}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-mumbai_dev_pass}
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('MUMBAI_INTERNAL_API_KEY', '${MUMBAI_INTERNAL_API_KEY:-dev_internal_secret_change_me}');
        define('MUMBAI_FRONTEND_URL', '${CUSTOMER_ORIGIN:-http://localhost:5173}');
    volumes:
      - wp_data:/var/www/html
      - ../apps/wordpress-plugin/mumbai-auth.php:/var/www/html/wp-content/plugins/mumbai-auth/mumbai-auth.php:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/wp-includes/version.php >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  wordpress-init:
    image: wordpress:cli-php8.2
    user: "0:0"
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-mumbai_wp}
      WORDPRESS_DB_USER: ${MYSQL_USER:-mumbai}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-mumbai_dev_pass}
      WP_SITE_URL: ${WP_SITE_URL:-http://localhost:8085}
      WP_SITE_TITLE: ${WP_SITE_TITLE:-Mumbai Collection Local}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-AdminDevPass123!}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.com}
      WOOCOMMERCE_CONSUMER_KEY: ${WOOCOMMERCE_CONSUMER_KEY:-ck_dev_mumbai_local_key_000000000000000000}
      WOOCOMMERCE_CONSUMER_SECRET: ${WOOCOMMERCE_CONSUMER_SECRET:-cs_dev_mumbai_local_secret_000000000000000}
    volumes:
      - wp_data:/var/www/html
      - ../apps/wordpress-plugin/mumbai-auth.php:/var/www/html/wp-content/plugins/mumbai-auth/mumbai-auth.php:ro
      - ./wp-init.sh:/usr/local/bin/wp-init.sh:ro
    entrypoint: ["sh", "/usr/local/bin/wp-init.sh"]

  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "--watch-path=src", "src/server.js"]
    depends_on:
      redis:
        condition: service_healthy
      wordpress:
        condition: service_healthy
      wordpress-init:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379
      WORDPRESS_URL: http://wordpress
      WOOCOMMERCE_URL: http://wordpress
      WOOCOMMERCE_CONSUMER_KEY: ${WOOCOMMERCE_CONSUMER_KEY:-ck_dev_mumbai_local_key_000000000000000000}
      WOOCOMMERCE_CONSUMER_SECRET: ${WOOCOMMERCE_CONSUMER_SECRET:-cs_dev_mumbai_local_secret_000000000000000}
      MUMBAI_INTERNAL_API_KEY: ${MUMBAI_INTERNAL_API_KEY:-dev_internal_secret_change_me}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      CUSTOMER_ORIGIN: ${CUSTOMER_ORIGIN:-http://localhost:5173}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:5174}
      EMPLOYEE_ORIGIN: ${EMPLOYEE_ORIGIN:-http://localhost:5175}
      CLIENT_ORIGIN: ${CUSTOMER_ORIGIN:-http://localhost:5173}
      FRONTEND_URL: ${CUSTOMER_ORIGIN:-http://localhost:5173}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://mumbaicollections.in,https://www.mumbaicollections.in}
      ALLOW_LOCAL_ORIGINS: "true"
      MOCK_EMAIL: ${MOCK_EMAIL:-true}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_EMAIL_SENDER_NAME: ${BREVO_EMAIL_SENDER_NAME:-Mumbai Collection}
      BREVO_EMAIL_SENDER_EMAIL: ${BREVO_EMAIL_SENDER_EMAIL:-noreply@mumbaicollection.in}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      ALLOW_TEST_PAYMENTS: ${ALLOW_TEST_PAYMENTS:-true}
    volumes:
      - ../apps/backend/src:/app/src:ro
      - backend_var:/app/var

volumes:
  mysql_data:
  redis_data:
  wp_data:
  backend_var:
